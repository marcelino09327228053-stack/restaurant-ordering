<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashier Login</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #17171b;
      --panel-2: #1f1f24;
      --line: #2b2b32;
      --text: #f5f5f4;
      --muted: #9a9aa3;
      --orange: #f97316;
      --orange-dark: #ea580c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #3a1a0bcc 0%, transparent 42%),
        radial-gradient(circle at 85% 80%, #7c2d1233 0%, transparent 35%),
        linear-gradient(160deg, #0b0b0d, #14100e 55%, #0b0b0d);
      -webkit-font-smoothing: antialiased;
    }
    form {
      width: min(400px, 94vw); background: #17171bee;
      border: 1px solid var(--line); border-radius: 20px;
      padding: 28px 24px; box-shadow: 0 24px 50px #00000066;
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    }
    .logo {
      width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--orange), #c2410c);
      font-size: 24px; flex: 0 0 auto;
    }
    h1 {
      margin: 0; font-size: 1.25rem; font-weight: 800;
      letter-spacing: .05em; text-transform: uppercase;
    }
    .brand small { display: block; color: var(--muted); margin-top: 3px; font-size: .78rem; letter-spacing: 0; text-transform: none; font-weight: 500; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
    label { display: block; margin-bottom: 7px; font-size: .84rem; color: #d4d4d8; font-weight: 600; }
    input {
      width: 100%; margin-bottom: 14px; padding: 13px 14px;
      border-radius: 12px; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--text); font: inherit; outline: 0;
    }
    input:focus { border-color: #6b4228; }
    button {
      width: 100%; border: 0; border-radius: 999px; padding: 13px 16px;
      background: var(--orange); color: #fff; font-weight: 800;
      cursor: pointer; font: inherit; box-shadow: 0 10px 26px #f9731640;
    }
    button:hover { background: var(--orange-dark); }
    .back-home {
      display: flex; align-items: center; justify-content: center; width: 100%;
      box-sizing: border-box; margin-top: 10px; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 999px; color: var(--text);
      text-decoration: none; font-weight: 750; background: transparent;
    }
    .back-home:hover { border-color: #45454f; }
    .error { color: #fca5a5; margin-top: 12px; min-height: 1.2em; font-size: .9rem; }
    button:disabled { opacity: .65; cursor: wait; }
  </style>
</head>
<body>
  <form onsubmit="login(event)">
    <div class="brand">
      <div class="logo">🍔</div>
      <div>
        <h1>Cashier Login</h1>
        <small>Live table orders</small>
      </div>
    </div>
    <label for="password">Cashier password</label>
    <input id="password" type="password" required autofocus autocomplete="current-password" placeholder="Enter cashier password" />
    <button id="signInButton" type="submit">Open cashier board</button>
    <a class="back-home" href="/">← Back to Home</a>
    <div id="error" class="error" role="alert"></div>
  </form>
  <script>
    async function login(event) {
      event.preventDefault();
      const error = document.getElementById("error");
      const button = document.getElementById("signInButton");
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = "Signing in…";
      error.textContent = "";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({password: document.getElementById("password").value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Login failed.");
        localStorage.setItem("restaurant_token", data.token);
        location.href = "/cashier";
      } catch (err) {
        error.textContent = err.message;
      } finally {
        button.disabled = false;
        button.textContent = "Open cashier board";
      }
    }
  </script>
</body>
</html>
