<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Table QR Codes</title>
  <style>
    :root { --orange:#f25b0a; --ink:#121212; --muted:#626262; }
    * { box-sizing:border-box; }
    body { margin:0; padding:34px; background:#eceae6; color:var(--ink); font-family:Arial,sans-serif; }
    .toolbar { max-width:1100px; margin:0 auto 24px; display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; }
    .toolbar h1 { margin:0; font-size:28px; }
    .toolbar p { margin:5px 0 0; color:var(--muted); max-width:52ch; line-height:1.4; }
    .banner {
      max-width:1100px; margin:0 auto 18px; padding:12px 14px; border-radius:12px;
      background:#fff7ed; border:1px solid #fdba74; color:#9a3412; font-size:14px;
    }
    button { border:0; border-radius:10px; padding:12px 20px; background:var(--orange); color:white; font-weight:800; cursor:pointer; }
    .sheet { max-width:1100px; margin:auto; display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
    .card { min-height:420px; padding:25px; background:white; border:2px solid #dedbd5; border-radius:22px; display:flex; flex-direction:column; align-items:center; text-align:center; break-inside:avoid; }
    .brand { font-size:14px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; }
    .brand::before { content:""; display:inline-block; width:11px; height:11px; margin-right:8px; border-radius:50%; background:var(--orange); }
    h2 { margin:14px 0 3px; font-size:32px; }
    .hint { margin:0 0 12px; color:var(--muted); font-size:14px; }
    img { width:245px; height:245px; display:block; background:#fff; }
    .scan { margin:10px 0 0; font-weight:800; }
    .url { margin:6px 0 0; color:var(--muted); font-size:11px; overflow-wrap:anywhere; }
    .error { max-width:1100px; margin:40px auto; padding:18px; background:#fee2e2; border-radius:12px; color:#991b1b; }
    @media(max-width:700px) { body{padding:16px}.sheet{grid-template-columns:1fr}.toolbar{align-items:flex-start}.card{min-height:auto} }
    @media print {
      @page { size:A4; margin:9mm; }
      body { padding:0; background:white; }
      .toolbar, .banner, .noprint { display:none; }
      .sheet { display:block; max-width:none; }
      .card { width:100%; height:129mm; margin:0; border:2px solid #222; border-radius:14px; justify-content:center; page-break-after:always; }
      .card:last-child { page-break-after:auto; }
      img { width:75mm; height:75mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>Table QR Codes</h1>
      <p id="subtitle">Scan to order and connect to the cashier.</p>
    </div>
    <button class="noprint" onclick="window.print()">Print QR Codes</button>
  </div>
  <div class="banner noprint" id="banner">Loading QR connection…</div>
  <main class="sheet" id="sheet"></main>
  <div class="error" id="error" hidden></div>

  <script>
    async function boot() {
      const token = localStorage.getItem("restaurant_token");
      if (!token) {
        document.getElementById("error").hidden = false;
        document.getElementById("error").textContent = "Open this page from the Cashier board (login first), then click Table QR Codes.";
        document.getElementById("banner").hidden = true;
        return;
      }
      try {
        const res = await fetch("/api/tables", {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Could not load tables.");
        const conn = data.connection || {};
        const tables = data.tables || [];
        document.getElementById("banner").textContent = conn.hint || "";
        document.getElementById("subtitle").textContent =
          `${conn.mode === "online" ? "Website address" : "Local Wi-Fi address"}: ${conn.lan_base || "—"}. Customer & cashier can chat after scanning.`;
        document.getElementById("sheet").innerHTML = tables.map(table => `
          <article class="card">
            <div class="brand">Restaurant Table</div>
            <h2>${escapeHtml(table.name)}</h2>
            <p class="hint">Scan to order &amp; message the cashier</p>
            <img src="${escapeHtml(table.qr_url)}" alt="QR code for ${escapeHtml(table.name)}">
            <p class="scan">SCAN · CONNECT · ORDER</p>
            <p class="url">${escapeHtml(table.order_url)}</p>
          </article>`).join("") || `<p class="error">No tables yet. Add tables on the cashier board.</p>`;
      } catch (e) {
        document.getElementById("error").hidden = false;
        document.getElementById("error").textContent = e.message;
        document.getElementById("banner").hidden = true;
      }
    }
    function escapeHtml(v) {
      const d = document.createElement("div");
      d.textContent = v == null ? "" : String(v);
      return d.innerHTML;
    }
    boot();
  </script>
</body>
</html>
