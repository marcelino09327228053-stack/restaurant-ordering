<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashier Login</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #111827, #7c2d12 55%, #1f2937);
      color: #f9fafb;
    }
    form {
      width: min(380px, 92vw); background: #111827ee; border: 1px solid #374151;
      border-radius: 16px; padding: 28px 24px; box-shadow: 0 18px 40px #0006;
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 18px; color: #9ca3af; }
    label { display: block; margin-bottom: 6px; font-size: .85rem; color: #d1d5db; }
    input {
      width: 100%; box-sizing: border-box; margin-bottom: 14px; padding: 12px 14px;
      border-radius: 10px; border: 1px solid #374151; background: #0b1120; color: white; font: inherit;
    }
    button {
      width: 100%; border: 0; border-radius: 10px; padding: 12px 14px;
      background: #ea580c; color: white; font-weight: 800; cursor: pointer;
    }
    .error { color: #fca5a5; margin-top: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <form onsubmit="login(event)">
    <h1>Restaurant Cashier</h1>
    <p>Sign in to see live table orders.</p>
    <label for="password">Cashier password</label>
    <input id="password" type="password" required autofocus placeholder="cashier123" />
    <button type="submit">Open cashier board</button>
    <div id="error" class="error"></div>
  </form>
  <script>
    async function login(event) {
      event.preventDefault();
      const error = document.getElementById("error");
      error.textContent = "";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({password: document.getElementById("password").value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Login failed.");
        localStorage.setItem("restaurant_token", data.token);
        location.href = "/cashier";
      } catch (err) {
        error.textContent = err.message;
      }
    }
  </script>
</body>
</html>
